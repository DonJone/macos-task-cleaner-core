[package]
name = "taskcleaner"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
objc2 = "0.5"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
