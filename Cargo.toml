[package]
name = "macos-task-cleaner-core"
version = "0.1.0"
edition = "2024"
description = "Core library for macOS Task Cleaner: GUI app scanning, tiered termination, and whitelist engine"
license = "AGPL-3.0-or-later"
repository = "https://github.com/DonJone/macos-task-cleaner-core"

[dependencies]
libc = "0.2"
objc2 = "0.5"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
